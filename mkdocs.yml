site_name: MATH 1554 Visual Companion
site_description: Course-synchronous Manim visualizations for linear algebra
repo_name: 1554-Visual-Companion

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - For students: for-students.md
  - For educators: for-educators.md
  - Curriculum map: curriculum.md
  - Chapter 1:
      - Overview: chapter01/index.md
      - 1.1 Systems: chapter01/01-01-systems-of-linear-equations.md
      - 1.2 Row reduction: chapter01/01-02-row-reduction-and-echelon-forms.md
      - 1.3 Vector equations: chapter01/01-03-vector-equations.md
      - 1.4 Ax = b: chapter01/01-04-matrix-equation.md
      - 1.5 Solution sets: chapter01/01-05-solution-sets.md
      - 1.7 Linear independence: chapter01/01-07-linear-independence.md
      - 1.8 Linear transformations: chapter01/01-08-linear-transformations.md
  - Contributing:
      - Contributor guide: contributing.md
      - Scene authoring: scene-authoring.md
      - Visual style: visual-style.md
      - Accessibility: accessibility.md
      - Architecture: architecture.md
      - Testing: development/testing.md
      - Adding a section: development/adding-a-section.md
      - Scene review rubric: development/review-rubric.md
      - Release checklist: development/release-checklist.md
      - Publish docs: development/publishing-docs.md
  - Reference:
      - Scene catalog: reference/scene-catalog.md
      - Commands: reference/commands.md
      - Licensing & attribution: licensing-and-attribution.md
      - FAQ: faq.md
