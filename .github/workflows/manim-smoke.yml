name: Manim smoke render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config libcairo2-dev libpango1.0-dev texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Low-quality smoke render
        run: math1554-render --section 1.1 --scene LinearEquationAsLine --quality low
