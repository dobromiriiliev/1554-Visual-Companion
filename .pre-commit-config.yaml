repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: repository-validation
        name: repository validation
        entry: python scripts/validate_repository.py
        language: system
        pass_filenames: false
